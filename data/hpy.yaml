# 学习率调度 (关键调整)
lr0: 0.005          # 从 0.01 降低 → 减少震荡
lrf: 0.01           # 最终 lr = 0.005 * 0.01 = 5e-5 (合理)
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# 损失函数权重 (针对单类别优化)
box: 7.5            # 从 10.0 降低 → 避免 box loss 主导
cls: 0.5            # 保留 (单类别仍需区分前景/背景)
dfl: 1.5            # 保留默认
obj: 1.0            # 从 0.7 提高 → 单类别更关注"有无目标"
label_smoothing: 0.0

# 数据增强 (大幅减弱！这是稳定 mAP 的关键)
hsv_h: 0.015
hsv_s: 0.5          # 从 0.7 降低
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.3          # 从 0.5 降低 → 减少缩放变形
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5

# 关键！关闭强增强
mosaic: 0.0         # 从 1.0 → 0.0 (彻底关闭)
mixup: 0.0          # 从 0.2 → 0.0 (彻底关闭)
copy_paste: 0.0

# 其他
pad: 0.0
rect: false
val_split: 0.0